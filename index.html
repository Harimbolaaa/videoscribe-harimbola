<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inkplainer — Free Whiteboard Animation Maker</title>
    <meta name="description" content="Inkplainer is a free whiteboard animation maker. Turn images and text into hand-drawn explainer videos with multiple animation styles, layer editing, and video export." />
    <meta property="og:title" content="Inkplainer — Free Whiteboard Animation Maker" />
    <meta property="og:description" content="Turn images and text into hand-drawn explainer videos with multiple animation styles, layer editing, and video export." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Patrick+Hand&family=Permanent+Marker&family=Roboto:wght@400;500;700&family=Merriweather:wght@400;700&family=Space+Mono&family=Nunito:wght@400;600;700&family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Hidden DOM references for animations.js engine backward compatibility -->
    <div style="display: none;" aria-hidden="true">
      <input type="range" id="speed-slider" min="1" max="100" value="40" />
      <span id="speed-val">40</span>
      <input type="range" id="hand-speed-slider" min="1" max="20" value="6" />
      <span id="hand-speed-val">6</span>
      <input type="range" id="tile-slider" min="6" max="80" value="30" />
      <span id="tile-val">30</span>
      <input type="range" id="spec-tile-slider" min="6" max="80" value="35" />
      <span id="spec-tile-val">35</span>
      <input type="checkbox" id="image-reveal" checked />
      <button id="play-pause-btn"></button>
      <div id="done-badge"></div>
      <div id="play-icon"></div>
      <div id="pause-icon"></div>
      <div id="progress-fill"></div>
      <span id="time-display">0%</span>
      <div id="outline-overlay"></div>
    </div>

    <!-- Core Animation Engine -->
    <script>
      window._mainCtx = null;
      window._runGroupAt = function(g) { if (window._runGroupAtImpl) window._runGroupAtImpl(g); };
      window._allLayersDone = function() { if (window._allLayersDoneImpl) window._allLayersDoneImpl(); };
    </script>
    <script src="/animations.js"></script>

    <!-- React Root -->
    <div id="root"></div>

    <!-- App Entry -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
